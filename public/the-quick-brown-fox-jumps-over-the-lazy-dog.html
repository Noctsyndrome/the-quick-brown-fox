<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quick Brown Fox</title>
<meta name="description" content="The quick brown fox jumps over the lazy dog, retold in different visual styles.">
<style>
@font-face{font-family:'DotGothic16';font-style:normal;font-weight:400;font-display:swap;src:url(/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/fonts/dotgothic16-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/fonts/ibm-plex-mono-400.woff2) format('woff2')}
:root{
  --paper:#f4f1ea;
  --ink:#24252a;
  --ink-soft:#6b6b66;
  --line:#ddd6c8;
  --hi:#efc04a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  min-height:100vh;display:flex;flex-direction:column;
  font:13px/1.6 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  padding:0 16px;
}
main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:clamp(40px,9vh,96px) 0 48px}
h1{
  font:400 clamp(26px,4.6vw,44px)/1.25 "DotGothic16","MS Gothic",ui-monospace,monospace;
  margin:0 0 clamp(28px,6vh,56px);text-wrap:balance;
  -webkit-font-smoothing:none;
}
.versions{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:28px}
.versions a{display:grid;gap:10px;color:inherit;text-decoration:none}
.versions img{
  display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;
  image-rendering:pixelated;image-rendering:crisp-edges;
  border:1px solid var(--line);
  transition:transform .12s,box-shadow .12s;
}
.versions img.smooth{image-rendering:auto}
/* A 3:2 print shown whole, centred in the 4:3 slot. */
.versions img.print{object-fit:contain;object-position:center;border:0;transition:transform .12s,filter .12s}
.versions a:hover img.print,.versions a:focus-visible img.print{box-shadow:none;filter:drop-shadow(0 3px 0 var(--hi))}
.versions span{letter-spacing:.08em}
.versions a:hover img,.versions a:focus-visible img{transform:translateY(-3px);box-shadow:0 3px 0 var(--hi)}
.versions a:focus-visible{outline:none}
.versions a:focus-visible span{background:var(--hi)}
.soon{display:grid;gap:10px;align-content:start}
.soon .slot{aspect-ratio:4/3;border:1px dashed #c9c0ae;display:flex;align-items:center;justify-content:center;gap:10px}
.soon i{width:8px;height:8px;background:#c9c0ae}
.soon span{color:var(--ink-soft)}
footer{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:0 0 28px;font-size:12px;color:var(--ink-soft)}
footer a{color:var(--ink)}
footer .brewing{text-underline-offset:.25em}
footer .brewing:hover{background:var(--hi)}
footer .source{text-decoration:none;font-size:11px}
footer .source:hover{text-decoration:underline;text-underline-offset:.25em}
@media (prefers-reduced-motion:reduce){.versions img{transition:none}}
</style>
</head>
<body>
<main>
  <h1>The quick brown fox jumps over the lazy dog</h1>
  <ul class="versions">
    <li><a href="/the-quick-brown-fox-jumps-over-the-lazy-dog/ps1">
      <img src="/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/thumbs/ps1.png" width="320" height="240" alt="A low-poly fox leaps over a sleeping dog in a misty PS1-style forest.">
      <span>PS1 CRT</span>
    </a></li>
    <li><a href="/the-quick-brown-fox-jumps-over-the-lazy-dog/diorama">
      <img src="/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/thumbs/diorama.png" width="480" height="300" alt="An isometric pixel forest diorama with a pond, a stream and a fox leaping over a sleeping dog.">
      <span>Pixel Diorama</span>
    </a></li>
    <li><a href="/the-quick-brown-fox-jumps-over-the-lazy-dog/pocket">
      <img src="/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/thumbs/pocket.png" width="192" height="144" alt="A four-shade green pocket LCD screen: a fox leaps over a sleeping dog above a text box reading the quick brown fox jumps over the lazy dog.">
      <span>Pocket LCD</span>
    </a></li>
    <li><a href="/the-quick-brown-fox-jumps-over-the-lazy-dog/terminal">
      <img class="smooth" src="/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/thumbs/terminal.png" width="640" height="480" alt="A curved CRT terminal: an ASCII-art fox with a bushy tail leaps over a sleeping ASCII dog between two pairs of pine trees.">
      <span>Terminal ASCII</span>
    </a></li>
    <li><a href="/the-quick-brown-fox-jumps-over-the-lazy-dog/ukiyoe">
      <img class="smooth print" src="/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/thumbs/ukiyoe.png" width="720" height="480" alt="A woodblock print of a snowy, moonlit winter night: beside a bare tree, a brown fox leaps over a black-and-tan shiba asleep in the snow, with Japanese title cartouches.">
      <span>Ukiyo-e Woodblock</span>
    </a></li>
    <li class="soon" aria-label="More styles still brewing">
      <div class="slot" aria-hidden="true"><i></i><i></i><i></i></div>
      <span aria-hidden="true">Still brewing</span>
    </li>
  </ul>
</main>
<footer>
  <span>by <a class="brewing" href="https://www.denkibrew.com/"><span aria-hidden="true">🍺</span> Dennki Brewing</a></span>
  <a class="source" href="https://github.com/Noctsyndrome/the-quick-brown-fox">GitHub <span aria-hidden="true">↗</span></a>
</footer>
</body>
</html>
