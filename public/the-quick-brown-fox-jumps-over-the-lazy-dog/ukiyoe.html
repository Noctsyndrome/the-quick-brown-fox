<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Brown Fox Ukiyo-e</title>
<style>
@font-face{font-family:'Yuji Syuku';font-style:normal;font-weight:400;font-display:block;src:url(/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/fonts/yuji-syuku-400.woff2) format('woff2')}
:root{--wall:#1c1d22;--dim:#4a4c55;--fg:#d8d2c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wall)}
/* One explicit row: elements that extensions append to <body> get empty implicit rows and cannot shift the print. */
body{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:1fr;place-items:center;padding:56px 16px 32px;overflow:hidden}
.back{position:fixed;top:16px;left:16px;z-index:3;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--dim);border-radius:50%;color:var(--fg);text-decoration:none}
.back:hover,.back:focus-visible{border-color:var(--fg);outline:none}
.sheet{position:relative;width:min(100%,1500px);width:min(100%,calc((100vh - 88px) * 1.5),1500px);width:min(100%,calc((100dvh - 88px) * 1.5),1500px);aspect-ratio:3/2;box-shadow:0 1px 0 #ffffff0d,0 30px 60px -30px #000}
.sheet canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
</style>
</head>
<body>
<a class="back" href="/the-quick-brown-fox-jumps-over-the-lazy-dog" aria-label="All versions"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="display:block"><path d="M11.5 7h-9M6 3 2.5 7 6 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<div class="sheet">
  <canvas id="print" role="img" aria-label="A woodblock print in the style of Hiroshige: on a snowy winter night under a full moon, beside a great bare tree, a brown fox leaps over a black-and-tan shiba asleep in the snow. A red title strip reads, in Japanese, the quick brown fox jumps over the lazy dog, and a square cartouche spells the English sentence in katakana."></canvas>
</div>
<script>
(() => {
'use strict';
/* The print is laid out on a 1500 x 1000 sheet (a horizontal oban). */
const LW = 1500, LH = 1000, FPS = 12, CYCLE = 6.4, G = 862, HZ = 560;
const MOON = { x: 905, y: 205, r: 64 };
const IMG = { x: 42, y: 42, w: 1416, h: 916 };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? Number(params.get('t')) : (reduce ? 2.4 : null);

const sheet = document.querySelector('.sheet');
const view = document.getElementById('print');

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const white = (a) => `rgba(255,255,255,${a})`;

/* ---------- plates ----------
   Each colour block is a canvas holding only coverage, in alpha: white where the block prints.
   The print shader stacks them on paper like pigments. */
let W = 0, H = 0, K = 1;
function canvas() { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; }
const NAMES = ['blue', 'ai', 'usu', 'shu', 'key', 'gof', 'ochre', 'keyD', 'ki', 'gofD', 'ko', 'usuD'];
const PL = {};
NAMES.forEach((n) => { PL[n] = canvas(); });
const packs = { S1: canvas(), S2: canvas(), D1: canvas(), D2: canvas() };
const PACKS = { S1: ['blue', 'ai', 'usu'], S2: ['shu', 'key', 'gof'], D1: ['ochre', 'keyD', 'ki'], D2: ['gofD', 'ko', 'usuD'] };
const tint = canvas();
const tmp = [canvas(), canvas(), canvas()];

function sizeAll() {
  const r = sheet.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(clamp(r.width * dpr, 600, 2400));
  if (w === W) return false;
  W = w; H = Math.round(w * LH / LW); K = W / LW;
  [...Object.values(PL), ...Object.values(packs), tint].forEach((p) => { p.c.width = W; p.c.height = H; });
  view.width = W; view.height = H;
  return true;
}
function logical(x) { x.setTransform(K, 0, 0, K, 0, 0); }
function clear(p) { p.x.setTransform(1, 0, 0, 1, 0, 0); p.x.globalCompositeOperation = 'source-over'; p.x.globalAlpha = 1; p.x.clearRect(0, 0, W, H); logical(p.x); }
function pack(name) {
  const dst = packs[name].x;
  dst.setTransform(1, 0, 0, 1, 0, 0);
  dst.globalCompositeOperation = 'source-over';
  dst.fillStyle = '#000'; dst.fillRect(0, 0, W, H);
  PACKS[name].forEach((n, i) => {
    const t = tint.x;
    t.setTransform(1, 0, 0, 1, 0, 0);
    t.globalCompositeOperation = 'copy';
    t.drawImage(PL[n].c, 0, 0);
    t.globalCompositeOperation = 'source-in';
    t.fillStyle = ['#f00', '#0f0', '#00f'][i];
    t.fillRect(0, 0, W, H);
    dst.globalCompositeOperation = 'lighter';
    dst.drawImage(tint.c, 0, 0);
  });
  dst.globalCompositeOperation = 'source-over';
}

/* ---------- shapes ---------- */
// A limb segment: the hull of two circles.
function capsule(p, ax, ay, ra, bx, by, rb) {
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  if (d < 1e-3 || d <= Math.abs(ra - rb)) { const [x, y, r] = ra > rb ? [ax, ay, ra] : [bx, by, rb]; p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); return p; }
  const th = Math.atan2(dy, dx), a = Math.acos(clamp((ra - rb) / d, -1, 1));
  p.moveTo(ax + ra * Math.cos(th + a), ay + ra * Math.sin(th + a));
  p.arc(ax, ay, ra, th + a, th + Math.PI * 2 - a);
  p.lineTo(bx + rb * Math.cos(th - a), by + rb * Math.sin(th - a));
  p.arc(bx, by, rb, th - a, th + a);
  p.closePath();
  return p;
}
function pathIn(T) {
  const p = new Path2D();
  return {
    p,
    M(x, y) { p.moveTo(...T(x, y)); return this; },
    L(x, y) { p.lineTo(...T(x, y)); return this; },
    Q(a, b, x, y) { p.quadraticCurveTo(...T(a, b), ...T(x, y)); return this; },
    C(a, b, c, d, x, y) { p.bezierCurveTo(...T(a, b), ...T(c, d), ...T(x, y)); return this; },
    Z() { p.closePath(); return this; },
  };
}

/* ---------- figures: fill blocks, a knockout and a key-block outline per group ---------- */
let box = { x: 0, y: 0, px: 0, py: 0, pw: 1, ph: 1 };
function setBox(x, y, w, h) {
  const px = Math.max(0, Math.floor(x * K)), py = Math.max(0, Math.floor(y * K));
  const pw = Math.min(W, Math.ceil((x + w) * K)) - px, ph = Math.min(H, Math.ceil((y + h) * K)) - py;
  box = { px, py, pw: Math.max(1, pw), ph: Math.max(1, ph) };
  tmp.forEach((t) => {
    if (t.c.width < box.pw || t.c.height < box.ph) { t.c.width = Math.max(t.c.width, box.pw); t.c.height = Math.max(t.c.height, box.ph); }
  });
}
function tclear(t) {
  t.x.setTransform(1, 0, 0, 1, 0, 0); t.x.globalCompositeOperation = 'source-over'; t.x.globalAlpha = 1;
  t.x.clearRect(0, 0, box.pw, box.ph);
  t.x.setTransform(K, 0, 0, K, -box.px, -box.py);
}
function blit(plate, t, op = 'source-over', alpha = 1) {
  const x = PL[plate].x;
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = op; x.globalAlpha = alpha;
  x.drawImage(t.c, 0, 0, box.pw, box.ph, box.px, box.py, box.pw, box.ph);
  x.restore();
}
function silhouette(t, shapes, grow = 0) {
  tclear(t);
  const x = t.x;
  x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.lineCap = 'round'; x.lineJoin = 'round';
  for (const s of shapes) {
    if (s.w) { x.lineWidth = s.w + grow * 2; x.stroke(s.p); }
    else { x.fill(s.p); if (grow) { x.lineWidth = grow * 2; x.stroke(s.p); } }
  }
}
const FIG_PLATES = ['ochre', 'ki', 'usuD'];
/* g: { shapes, kw (outline width), fills: [[plate, alpha | fn(ctx) -> style]], after(ctx) } */
function figure(g, keyPlate = 'keyD', koPlate = 'ko', occlude = FIG_PLATES) {
  const [A, B, C] = tmp;
  silhouette(A, g.shapes);
  silhouette(B, g.shapes, g.kw ?? 2.4);
  B.x.save(); B.x.setTransform(1, 0, 0, 1, 0, 0); B.x.globalCompositeOperation = 'destination-out'; B.x.drawImage(A.c, 0, 0); B.x.restore();
  occlude.forEach((n) => blit(n, A, 'destination-out'));
  blit(keyPlate, A, 'destination-out');
  if (koPlate) blit(koPlate, A);
  for (const [plate, v] of g.fills || []) {
    if (typeof v === 'number') blit(plate, A, 'source-over', v);
    else {
      tclear(C); C.x.drawImage(A.c, 0, 0, box.pw, box.ph, box.px / K, box.py / K, box.pw / K, box.ph / K);
      C.x.globalCompositeOperation = 'source-in'; C.x.fillStyle = v(C.x); C.x.fillRect(-10, -10, LW + 20, LH + 20);
      blit(plate, C);
    }
  }
  if (g.kw !== 0) blit(keyPlate, B);
  if (g.after) g.after();
}
// Strokes and fills straight onto a plate, in sheet units.
function ink(plate, fn) { const x = PL[plate].x; x.save(); logical(x); x.lineCap = 'round'; x.lineJoin = 'round'; fn(x); x.restore(); }

/* ---------- the fox ---------- */
/* Angles: 0 points straight down, positive swings forward (the fox faces right). */
const POSES = {
  run1: { tilt: 0.03, arch: -2, st: 1.08, head: 0.02, tail: 0.12, curl: 0.25, nf: [1.0, 1.25, 1.9], ff: [0.75, 0.95, 1.8], nh: [-0.55, -1.2, -1.15, -0.5], fh: [-0.75, -1.35, -1.3, -0.7] },
  run2: { tilt: -0.04, arch: 6, st: 0.96, head: 0.1, tail: 0.28, curl: 0.5, nf: [0.15, -0.05, 1.0], ff: [-0.15, -0.3, 0.7], nh: [-0.1, -0.95, -0.55, 0.2], fh: [-0.3, -1.1, -0.8, 0] },
  run3: { tilt: -0.02, arch: 9, st: 0.9, head: 0.14, tail: 0.32, curl: 0.55, nf: [-0.45, -0.55, 0.3], ff: [-0.2, -0.3, 0.6], nh: [0.9, 0.0, 0.5, 1.3], fh: [0.7, -0.15, 0.35, 1.2] },
  run4: { tilt: 0.0, arch: 3, st: 1.0, head: 0.06, tail: 0.2, curl: 0.4, nf: [0.45, 0.3, 1.5], ff: [0.25, 0.05, 1.4], nh: [0.45, -0.55, 0.0, 1.0], fh: [0.2, -0.8, -0.25, 0.8] },
  crouch: { tilt: -0.12, arch: 12, st: 0.88, head: -0.12, tail: 0.35, curl: 0.5, nf: [-0.25, 0.15, 1.5], ff: [-0.05, 0.3, 1.5], nh: [1.15, -1.0, 0.35, 1.3], fh: [1.0, -1.1, 0.25, 1.3] },
  takeoff: { tilt: 0.4, arch: -2, st: 1.06, head: 0.15, tail: 0.25, curl: 0.3, nf: [1.1, 1.0, 1.3], ff: [0.85, 0.6, 1.1], nh: [-0.7, -1.3, -1.5, -1.6], fh: [-0.5, -1.15, -1.3, -1.4] },
  flight: { tilt: 0.04, arch: -6, st: 1.1, head: 0.04, tail: 0.3, curl: 0.25, nf: [1.2, 1.35, 1.0], ff: [0.95, 1.05, 0.8], nh: [-0.7, -1.25, -1.05, -0.6], fh: [-0.45, -1.05, -0.8, -0.3] },
  reach: { tilt: -0.32, arch: 2, st: 1.04, head: -0.12, tail: 0.4, curl: 0.3, nf: [0.6, 0.35, 1.3], ff: [0.85, 0.65, 1.4], nh: [0.5, -0.9, -0.2, 0.6], fh: [0.3, -1.0, -0.4, 0.4] },
  land: { tilt: -0.16, arch: 8, st: 0.9, head: -0.05, tail: 0.5, curl: 0.45, nf: [0.12, -0.15, 1.4], ff: [0.32, 0.1, 1.45], nh: [0.65, -0.45, 0.3, 1.0], fh: [0.45, -0.65, 0.15, 1.0] },
};
const RUN = ['run1', 'run2', 'run3', 'run4'];
function mix(a, b, t) {
  const o = {};
  for (const k in a) o[k] = Array.isArray(a[k]) ? a[k].map((v, i) => lerp(v, b[k][i], t)) : lerp(a[k], b[k], t);
  return o;
}
const FRONT = [36, 36, 13], FRONT_R = [12, 6.5, 5, 4.6];
const HIND = [40, 38, 30, 11], HIND_R = [19, 9, 6, 5, 4.4];
function legChain(x, y, angles, lens, radii) {
  const pts = [[x, y]];
  angles.forEach((a, i) => { x += Math.sin(a) * lens[i]; y += Math.cos(a) * lens[i]; pts.push([x, y]); });
  return { pts, radii };
}
function foxRig(pose, X, air) {
  const A = -pose.tilt, c = Math.cos(A), s = Math.sin(A), st = pose.st;
  const R = (x, y) => [x * c - y * s, x * s + y * c];
  const Bd = (x, y) => R(x * st, y);
  const legs = {
    ff: legChain(...Bd(34, 2), pose.ff, FRONT, FRONT_R),
    fh: legChain(...Bd(-48, 0), pose.fh, HIND, HIND_R),
    nf: legChain(...Bd(42, 4), pose.nf, FRONT, FRONT_R),
    nh: legChain(...Bd(-56, 2), pose.nh, HIND, HIND_R),
  };
  let low = -Infinity;
  for (const l of Object.values(legs)) for (const [, y] of l.pts) low = Math.max(low, y + 4);
  const tx = X, ty = G - air - low;
  const T = (x, y) => { const [u, v] = Bd(x, y); return [u + tx, v + ty]; };
  const hc = Math.cos(-pose.head), hs = Math.sin(-pose.head);
  const N = [60, -30];
  const TH = (x, y) => { const [u, v] = R(N[0] * st + x * hc - y * hs, N[1] + x * hs + y * hc); return [u + tx, v + ty]; };
  const TT = (x, y) => { const [u, v] = R(-66 * st + x, -8 + y); return [u + tx, v + ty]; };
  for (const l of Object.values(legs)) l.pts = l.pts.map(([x, y]) => [x + tx, y + ty]);
  return { T, TH, TT, legs, pose, ground: ty + low };
}
function legPath(l) {
  const p = new Path2D();
  for (let i = 0; i < l.pts.length - 1; i++) capsule(p, ...l.pts[i], l.radii[i], ...l.pts[i + 1], l.radii[i + 1]);
  return p;
}
function lowerLegPath(l, from) {
  const p = new Path2D();
  const [ax, ay] = l.pts[from], [bx, by] = l.pts[from + 1];
  const m = [lerp(ax, bx, 0.45), lerp(ay, by, 0.45)];
  capsule(p, ...m, lerp(l.radii[from], l.radii[from + 1], 0.45) + 0.4, bx, by, l.radii[from + 1] + 0.4);
  for (let i = from + 1; i < l.pts.length - 1; i++) capsule(p, ...l.pts[i], l.radii[i] + 0.4, ...l.pts[i + 1], l.radii[i + 1] + 0.4);
  return p;
}
function tailPaths(rig) {
  const { pose, TT } = rig;
  const ang = pose.tail, L = 128, dir = [-Math.cos(ang), -Math.sin(ang)], perp = [dir[1], -dir[0]];
  const flip = perp[1] > 0 ? -1 : 1;
  const P0 = [0, 0], P2 = [dir[0] * L, dir[1] * L + 6];
  const P1 = [dir[0] * L * 0.5 + perp[0] * flip * pose.curl * 38, dir[1] * L * 0.5 + perp[1] * flip * pose.curl * 38];
  const pt = (t) => [(1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1]];
  const N = 16, left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = pt(Math.max(0, t - 0.01)), b = pt(Math.min(1, t + 0.01));
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    const w = (t < 1 ? 11 + 18 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.02 + 0.08)), 0.75) : 0) * (1 - 0.25 * t);
    const c = pt(t);
    left.push([c[0] + nx * w, c[1] + ny * w]); right.push([c[0] - nx * w, c[1] - ny * w]);
  }
  const outline = (from, to) => {
    const p = pathIn(TT);
    p.M(...left[from]);
    for (let i = from + 1; i <= to; i++) p.L(...left[i]);
    for (let i = to; i >= from; i--) p.L(...right[i]);
    return p.Z().p;
  };
  return { all: outline(0, N), tip: outline(Math.round(N * 0.74), N), mid: pt(0.5), end: pt(1), left, right };
}
function drawFox(rig) {
  const { T, TH, legs, pose } = rig;
  const arch = pose.arch;
  const torso = pathIn(T).M(-82, -2)
    .C(-76, -30 - arch, -10, -34 - arch * 1.2, 44, -27)
    .C(68, -22, 76, 8, 56, 32)
    .C(32, 40, 6, 27, -24, 21)
    .C(-54, 34, -90, 28, -82, -2).Z().p;
  const neck = pathIn((x, y) => (x > 1000 ? TH(x - 2000, y) : T(x, y)))
    .M(28, -25).Q(40, -40, 2000 - 6, -16).L(2000 + 2, 16).Q(2000 - 4, 30, 62, 30).Z().p;
  const head = pathIn(TH).M(-8, -16)
    .C(4, -27, 24, -24, 34, -13)
    .C(44, -9, 54, -5, 62, -2)
    .C(62, 4, 52, 7, 40, 8)
    .C(28, 14, 10, 21, -4, 16)
    .C(-16, 10, -18, -8, -8, -16).Z().p;
  // Ears: a curved back edge, a straighter front, a rounded tip.
  const ear = (dx) => pathIn(TH).M(-7 + dx, -14).C(-10 + dx, -27, -6 + dx, -41, 1 + dx, -50)
    .C(3 + dx, -52, 6 + dx, -51, 7 + dx, -47).C(12 + dx, -37, 16 + dx, -27, 17 + dx, -18).Z().p;
  const earTip = (dx) => (x) => { x.save(); x.clip(ear(dx)); x.fillStyle = white(1); x.fill(pathIn(TH).M(-20 + dx, -60).L(30 + dx, -60).L(30 + dx, -38).C(10 + dx, -34, 0 + dx, -36, -20 + dx, -40).Z().p); x.restore(); };
  const innerEar = pathIn(TH).M(0, -18).C(-2, -28, 0, -37, 4, -42).C(8, -35, 11, -27, 13, -19).Z().p;
  const tail = tailPaths(rig);
  // Far legs, a shade lighter.
  figure({ shapes: [{ p: legPath(legs.fh) }, { p: legPath(legs.ff) }], fills: [['ochre', 0.62]],
    after: () => { const p = new Path2D(); p.addPath(lowerLegPath(legs.fh, 1)); p.addPath(lowerLegPath(legs.ff, 1)); ink('usuD', (x) => { x.fillStyle = white(0.95); x.fill(p); }); } });
  // The tail is part of the body's outline, so no seam shows where it joins.
  const tailAfter = () => {
      ink('ochre', (x) => { x.globalCompositeOperation = 'destination-out'; x.fill(tail.tip); });
      // Fur lines where the white tip begins.
      ink('keyD', (x) => {
        x.strokeStyle = '#fff'; x.lineWidth = 1.6;
        const i = Math.round(16 * 0.74);
        for (const side of [tail.left, tail.right]) {
          const [px, py] = rig.TT(...side[i]); const [qx, qy] = rig.TT(...side[i + 1]);
          x.beginPath(); x.moveTo(px, py); x.lineTo(lerp(px, qx, 0.4) + (qy - py) * 0.12, lerp(py, qy, 0.4) - (qx - px) * 0.12); x.stroke();
        }
        const [a, b] = rig.TT(...tail.left[i]), [c, d] = rig.TT(...tail.right[i]);
        x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo((a + c) / 2 + (d - b) * 0.15, (b + d) / 2 - (c - a) * 0.15, c, d); x.lineWidth = 1.3; x.stroke();
      });
  };
  figure({ shapes: [{ p: ear(-10) }], fills: [['ochre', 0.85]], after: () => ink('usuD', earTip(-10)) });
  const back = (x) => { const [a, b] = T(0, -36 - arch), [c, d] = T(0, 32); const g = x.createLinearGradient(a, b, c, d); g.addColorStop(0, white(1)); g.addColorStop(0.55, white(0.82)); g.addColorStop(1, white(0.62)); return g; };
  figure({ shapes: [{ p: tail.all }, { p: torso }, { p: neck }, { p: head }, { p: legPath(legs.nh) }, { p: legPath(legs.nf) }], fills: [['ochre', back]],
    after: () => {
      tailAfter();
      // White chest, throat and cheek: carved out of the brown block.
      ink('ochre', (x) => {
        x.globalCompositeOperation = 'destination-out';
        x.fill(pathIn(T).M(52, -18).C(66, -8, 70, 12, 58, 31).C(48, 26, 44, 4, 52, -18).Z().p);

/* ---------- fox fires: carved out of the night, printed pale yellow with a warm edge ---------- */
function fire(x, y, s, phase) {
  const f = 0.92 + 0.08 * Math.sin(phase * 7.3);
  ink('ko', (c) => { const g = c.createRadialGradient(x, y, 0, x, y, 30 * s); g.addColorStop(0, white(1)); g.addColorStop(0.5, white(0.75)); g.addColorStop(1, white(0)); c.fillStyle = g; c.beginPath(); c.arc(x, y, 30 * s, 0, Math.PI * 2); c.fill(); });
  const flame = new Path2D();
  const lean = Math.sin(phase * 3.1) * 4 * s;
  flame.moveTo(x, y + 9 * s * f);
  flame.bezierCurveTo(x - 11 * s, y + 8 * s, x - 10 * s, y - 6 * s, x - 2 * s + lean * 0.4, y - 10 * s);
  flame.bezierCurveTo(x + 2 * s + lean, y - 16 * s * f, x + 6 * s + lean, y - 22 * s * f, x + lean * 1.6, y - 28 * s * f);
  flame.bezierCurveTo(x + 14 * s + lean, y - 14 * s, x + 12 * s, y + 8 * s, x, y + 9 * s * f);
  ink('ochre', (c) => { const g = c.createRadialGradient(x, y, 0, x, y, 20 * s); g.addColorStop(0, white(0)); g.addColorStop(0.55, white(0.18)); g.addColorStop(1, white(0)); c.fillStyle = g; c.beginPath(); c.arc(x, y, 20 * s, 0, Math.PI * 2); c.fill(); c.fillStyle = white(0.28); c.fill(flame); });
  ink('ki', (c) => { const g = c.createRadialGradient(x, y + 2 * s, 0, x, y + 2 * s, 14 * s); g.addColorStop(0, white(0.25)); g.addColorStop(1, white(0.95)); c.fillStyle = g; c.fill(flame); });
}

function growTree() {
  const r = rng(23), segs = [];
  function limb(x, y, ang, len, w0, w1, depth, sway, jit = 0.42) {
    const n = Math.max(2, Math.round(len / 20));
    let px = x, py = y;
    for (let i = 0; i < n; i++) {
      ang += (r() - 0.5) * jit + sway;
      const step = len / n, nx = px + Math.cos(ang) * step, ny = py + Math.sin(ang) * step;
      const wa = lerp(w0, w1, i / n), wb = lerp(w0, w1, (i + 1) / n);
      segs.push({ ax: px, ay: py, bx: nx, by: ny, ra: wa / 2, rb: wb / 2 });
      if (depth > 0 && i > 0 && r() < 0.3 && wa > 3) {
        const side = r() < 0.5 ? -1 : 1;
        limb(px, py, ang + side * (0.55 + r() * 0.55), len * (0.38 + r() * 0.22), wa * 0.5, wa * 0.18, depth - 1, 0);
      }
      px = nx; py = ny;
    }
    if (depth > 0 && w1 > 1.6) {
      limb(px, py, ang - 0.32 - r() * 0.2, len * 0.66, w1 * 0.8, w1 * 0.3, depth - 1, 0);
      limb(px, py, ang + 0.3 + r() * 0.2, len * 0.58, w1 * 0.7, w1 * 0.26, depth - 1, 0);
    }
  }
  // Trunk, then the great limbs of the old tree.
  limb(262, 960, -1.56, 300, 150, 104, 0, 0, 0.1);
  const top = segs[segs.length - 1];
  limb(top.bx, top.by + 6, -1.62, 200, 104, 70, 0, 0, 0.14);
  const crown = segs[segs.length - 1];
  limb(crown.bx - 10, crown.by + 30, -2.45, 330, 54, 16, 3, 0.025, 0.3);
  limb(crown.bx, crown.by, -1.75, 360, 52, 16, 3, 0.01, 0.3);
  limb(crown.bx + 18, crown.by + 40, -0.62, 470, 48, 12, 3, 0.006, 0.3);
  limb(crown.bx + 6, crown.by + 110, -0.35, 230, 32, 9, 2, 0.02, 0.3);
  limb(crown.bx - 14, crown.by + 90, -2.9, 200, 28, 9, 2, -0.03, 0.3);
  return segs;
}

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(prog, n), i);
    tex[n] = { t, unit: i };
  });
  U.res = gl.getUniformLocation(prog, 'res'); U.off = gl.getUniformLocation(prog, 'off');
  return true;
}
function upload(name, src) { const t = tex[name]; gl.activeTexture(gl.TEXTURE0 + t.unit); gl.bindTexture(gl.TEXTURE_2D, t.t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src.c); }
// Registration: every block sits a little off true, and wanders a hair from one impression to the next.
const OFF = [[1.6, -1.1], [-1.2, 1.4], [0.8, 1.6], [-1.8, -0.6], [0, 0], [2.2, 1.2], [-0.8, -1.4], [0, 0]];
function press(frame) {
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U.res, W, H);
  const r = rng(frame * 7 + 1), j = frozen === null ? 0.45 : 0;
  gl.uniform2fv(U.off, new Float32Array(OFF.flatMap(([x, y], i) => (i === 4 ? [0, 0] : [x + (r() - 0.5) * j, y + (r() - 0.5) * j]))));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
// Without WebGL: multiply the blocks onto a flat sheet.
const FALLBACK = [['blue', '#26407f'], ['ai', '#5c759f'], ['usu', '#a8a9b2'], ['ki', '#fff28c'], ['ochre', '#db8f4d'], ['usuD', '#a8a9b2'], ['shu', '#e04d33'], ['key', '#1f1f24'], ['keyD', '#1f1f24']];
function pressFlat(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#f1e9d6'; ctx.fillRect(0, 0, W, H);
  for (const [n, col] of FALLBACK) {
    const t = tint.x; t.setTransform(1, 0, 0, 1, 0, 0); t.globalCompositeOperation = 'copy'; t.drawImage(PL[n].c, 0, 0);
    t.globalCompositeOperation = 'source-in'; t.fillStyle = col; t.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(tint.c, 0, 0);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(PL.gof.c, 0, 0); ctx.drawImage(PL.gofD.c, 0, 0);
}

let flat = null, last = -1;
function frame(now) {
  const time = frozen !== null ? frozen : now / 1000;
  const f = Math.floor(time * FPS);
  if (f !== last) {
    last = f;
    const tq = f / FPS;
    drawDynamic(frozen !== null ? frozen : tq);
    if (gl) { upload('d1', packs.D1); upload('d2', packs.D2); press(f); }
    else pressFlat(flat);
  }
  if (frozen === null) requestAnimationFrame(frame);
}
function rebuild() {
  drawStatic();
  if (gl) { upload('s1', packs.S1); upload('s2', packs.S2); }
  last = -1;
}

Promise.all([
  document.fonts.load('33px "Yuji Syuku"', '素早き茶狐怠け犬を跳び越ゆ電気醸ザクイックブラウンフォックスジャンプスオーバーレイジードッグ・ー'),
]).catch(() => {}).then(() => {
  sizeAll();
  try { if (!initGL()) throw new Error('no webgl'); } catch (e) { gl = null; flat = view.getContext('2d'); }
  rebuild();
  requestAnimationFrame(frame);
  let pending = 0;
  addEventListener('resize', () => {
    clearTimeout(pending);
    pending = setTimeout(() => { if (sizeAll()) { rebuild(); if (frozen !== null) requestAnimationFrame(frame); } }, 150);
  });
});
})();
</script>
