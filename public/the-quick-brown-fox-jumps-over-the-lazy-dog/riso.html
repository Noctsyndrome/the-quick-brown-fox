@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:block;src:url(/the-quick-brown-fox-jumps-over-the-lazy-dog/assets/fonts/ibm-plex-mono-500.woff2) format('woff2')}
:root{--page:#e7e5de;--dim:#a9a59b;--fg:#4a4740;--hover:#d9d6ce;--edge:#d6d1c5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
/* One explicit row: elements that extensions append to <body> get empty implicit rows and cannot shift the print. */
body{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:1fr;place-items:center;padding:56px 16px 32px;overflow:hidden}
.back{position:fixed;top:16px;left:16px;z-index:3;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--dim);border-radius:50%;color:var(--fg);text-decoration:none}
.back:hover,.back:focus-visible{border-color:var(--fg);background:var(--hover);outline:none}
.sheet{position:relative;width:min(100%,1440px);width:min(100%,calc((100vh - 88px) * 1.5),1440px);width:min(100%,calc((100dvh - 88px) * 1.5),1440px);aspect-ratio:3/2;border:1px solid var(--edge);box-shadow:0 1px 2px #00000012,0 20px 44px -24px #2a251d52}

<body>
<a class="back" href="/the-quick-brown-fox-jumps-over-the-lazy-dog" aria-label="All versions"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="display:block"><path d="M11.5 7h-9M6 3 2.5 7 6 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<div class="sheet">
  <canvas id="print" role="img" aria-label="A three-colour Risograph print animation in sunflower yellow, fluorescent orange and indigo on warm uncoated paper: beneath an airy blue halftone sky and rolling meadow hills, a fox with a crisp paper-white tail tip leaps over a sleeping golden-brown dog above the sentence: the quick brown fox jumps over the lazy dog."></canvas>
</div>
<script>
(() => {
'use strict';

/* Logical 3:2 Risograph sheet (1200 x 800) with generous uncoated paper margins. */
const LW = 1200, LH = 800;
const IMG = { x: 56, y: 52, w: 1088, h: 616 }; // Print image area
const GY = 576;                                // Ground baseline inside print area
const DOG_X = 616;                             // Sleeping dog centred in the meadow
const SUN = { x: 966, y: 146, r: 48 };         // Small, understated warm sun tucked high on the right
const FPS = 12;                                // Classic Risograph frame-by-frame animation cadence
const CYCLE = 3.0;                             // Seconds per loop (36 frames)
const FRAMES = Math.round(FPS * CYCLE);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? Number(params.get('t')) : (reduce ? 1.5 : null);

const sheetEl = document.querySelector('.sheet');
const view = document.getElementById('print');

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};

/* ---------- Three-Drum Offscreen Coverage Buffers ----------
   Pure 3-drum Risograph:
   - R channel (drumO): Fluorescent Orange
   - G channel (drumB): Federal Indigo Blue
   - B channel (drumY): Sunflower Yellow
   Overprints emerge optically in the shader (Yellow + Indigo -> moss green,
   Orange + Indigo -> deep plum brown, Orange + Yellow -> rich persimmon). */
function makeBuf() {
  const c = document.createElement('canvas');
  return { c, x: c.getContext('2d') };
}
const staticO = makeBuf(), staticB = makeBuf(), staticY = makeBuf();
const drumO = makeBuf(), drumB = makeBuf(), drumY = makeBuf();
const tint = makeBuf(), packed = makeBuf();

let W = 0, H = 0, K = 1;

function resizeBuffers() {
  const r = sheetEl.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(clamp(r.width * dpr, 720, 2100));
  if (w === W) return false;
  W = w;
  H = Math.round(w * LH / LW);
  K = W / LW;
  view.width = W;
  view.height = H;
  [staticO, staticB, staticY, drumO, drumB, drumY, tint, packed].forEach((b) => {
    b.c.width = W;
    b.c.height = H;
  });
  return true;
}

function resetCtx(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.setTransform(K, 0, 0, K, 0, 0);
}

function clipImageArea(ctx) {
  ctx.beginPath();
  ctx.rect(IMG.x, IMG.y, IMG.w, IMG.h);
  ctx.clip();
}

/* ---------- Static Risograph Backdrop (Baked Once Per Resize) ---------- */
function drawStaticBackdrop() {
  [staticO, staticB, staticY].forEach((b) => resetCtx(b.x));
  const oCtx = staticO.x, bCtx = staticB.x, yCtx = staticY.x;

  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    clipImageArea(ctx);
  });

  // 1. Clean airy sky wash: soft Indigo halftone only (no competing yellow speckles),
  //    giving crisp contrast for the fox's paper-white tail tip, cheek, chest bib & clouds.
  const skyGrad = bCtx.createLinearGradient(0, IMG.y, 0, GY - 20);
  skyGrad.addColorStop(0, 'rgba(255,255,255,0.23)');
  skyGrad.addColorStop(0.55, 'rgba(255,255,255,0.15)');
  skyGrad.addColorStop(1, 'rgba(255,255,255,0.09)');
  bCtx.fillStyle = skyGrad;
  bCtx.fillRect(IMG.x, IMG.y, IMG.w, GY - IMG.y);

  // 2. Small, quiet pale-yellow sun tucked off to the upper right so the fox owns centre stage
  bCtx.save();
  bCtx.globalCompositeOperation = 'destination-out';
  bCtx.fillStyle = '#fff';
  bCtx.beginPath();
  bCtx.arc(SUN.x, SUN.y, SUN.r, 0, Math.PI * 2);
  bCtx.fill();
  bCtx.restore();

  yCtx.fillStyle = 'rgba(255,255,255,0.62)';
  yCtx.beginPath();
  yCtx.arc(SUN.x, SUN.y, SUN.r, 0, Math.PI * 2);
  yCtx.fill();

  // 3. Crisp graphic paper-white cloud bands drifting high in the sky
  const drawCloud = (cx, cy, w, h) => {
    const p = new Path2D();
    p.moveTo(cx - w * 0.5, cy);
    p.bezierCurveTo(cx - w * 0.45, cy - h, cx - w * 0.12, cy - h * 1.12, cx + w * 0.05, cy - h * 0.62);
    p.bezierCurveTo(cx + w * 0.22, cy - h * 0.96, cx + w * 0.46, cy - h * 0.55, cx + w * 0.5, cy);
    p.closePath();
    [oCtx, bCtx, yCtx].forEach((ctx) => {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = '#fff';
      ctx.fill(p);
      ctx.restore();
    });
  };
  drawCloud(286, 174, 176, 32);
  drawCloud(742, 146, 148, 27);

  // 4. Distant rolling hill (soft teal-green from Yellow + light Indigo overprint)
  const farHill = new Path2D();
  farHill.moveTo(IMG.x, IMG.y + IMG.h);
  farHill.lineTo(IMG.x, 488);
  farHill.bezierCurveTo(220, 446, 395, 458, 560, 496);
  farHill.bezierCurveTo(750, 538, 920, 434, IMG.x + IMG.w, 472);
  farHill.lineTo(IMG.x + IMG.w, IMG.y + IMG.h);
  farHill.closePath();

  yCtx.fillStyle = 'rgba(255,255,255,0.52)';
  yCtx.fill(farHill);
  bCtx.fillStyle = 'rgba(255,255,255,0.34)';
  bCtx.fill(farHill);

  // 5. Stylized mid-century Risograph trees framing the left & right edges
  const drawTree = (tx, baseY, trunkH, crownR, lean = 0) => {
    // Tree crown: Yellow + Indigo -> rich forest green
    const crown = new Path2D();
    crown.ellipse(tx + lean, baseY - trunkH - crownR * 0.52, crownR * 0.86, crownR, 0, 0, Math.PI * 2);

    // Clear orange/blue slightly for clean green overprint
    oCtx.save();
    oCtx.globalCompositeOperation = 'destination-out';
    oCtx.fillStyle = '#fff';
    oCtx.fill(crown);
    oCtx.restore();

    yCtx.fillStyle = 'rgba(255,255,255,0.84)';
    yCtx.fill(crown);
    bCtx.fillStyle = 'rgba(255,255,255,0.56)';
    bCtx.fill(crown);

    // Sunlit side highlight on crown (paper-brighter yellow)
    bCtx.save();
    bCtx.clip(crown);
    bCtx.globalCompositeOperation = 'destination-out';
    bCtx.fillStyle = 'rgba(255,255,255,0.42)';
    bCtx.beginPath();
    bCtx.arc(tx + lean + (tx < LW / 2 ? crownR * 0.35 : -crownR * 0.35), baseY - trunkH - crownR * 0.62, crownR * 0.68, 0, Math.PI * 2);
    bCtx.fill();
    bCtx.restore();

    // Trunk & simple geometric branches (Orange + Indigo -> warm dark bark)
    const trunk = new Path2D();
    trunk.moveTo(tx - 6, baseY);
    trunk.lineTo(tx - 3 + lean * 0.6, baseY - trunkH - crownR * 0.25);
    trunk.lineTo(tx + 3 + lean * 0.6, baseY - trunkH - crownR * 0.25);
    trunk.lineTo(tx + 6, baseY);
    trunk.closePath();

    oCtx.fillStyle = 'rgba(255,255,255,0.68)';
    oCtx.fill(trunk);
    bCtx.fillStyle = 'rgba(255,255,255,0.92)';
    bCtx.fill(trunk);
  };

  drawTree(146, 512, 86, 56, 4);
  drawTree(228, 520, 56, 38, -2);
  drawTree(1042, 508, 92, 60, -5);
  drawTree(954, 518, 54, 35, 3);

  // 6. Foreground sunlit meadow bank (rich moss-olive Riso overprint)
  const meadow = new Path2D();
  meadow.moveTo(IMG.x, IMG.y + IMG.h);
  meadow.lineTo(IMG.x, GY - 34);
  meadow.bezierCurveTo(260, GY - 54, 435, GY - 22, 620, GY - 24);
  meadow.bezierCurveTo(815, GY - 26, 980, GY - 52, IMG.x + IMG.w, GY - 30);
  meadow.lineTo(IMG.x + IMG.w, IMG.y + IMG.h);
  meadow.closePath();

  // Knock out distant trees beneath meadow
  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(meadow);
    ctx.restore();
  });

  yCtx.fillStyle = 'rgba(255,255,255,0.88)';
  yCtx.fill(meadow);
  bCtx.fillStyle = 'rgba(255,255,255,0.44)';
  bCtx.fill(meadow);

  // Subtle darker foreground edge band along the bottom of the meadow
  const lowBand = new Path2D();
  lowBand.moveTo(IMG.x, IMG.y + IMG.h);
  lowBand.lineTo(IMG.x, GY + 34);
  lowBand.bezierCurveTo(340, GY + 16, 740, GY + 44, IMG.x + IMG.w, GY + 24);
  lowBand.lineTo(IMG.x + IMG.w, IMG.y + IMG.h);
  lowBand.closePath();

  bCtx.fillStyle = 'rgba(255,255,255,0.28)';
  bCtx.fill(lowBand);

  // Small scattered wildflowers (paper-white petals & orange dots) in the grass
  const flowers = [
    [138, 602, 1], [174, 624, 0], [286, 616, 1], [358, 634, 0],
    [842, 622, 1], [904, 604, 0], [988, 628, 1], [1062, 608, 0],
  ];
  flowers.forEach(([fx, fy, isOrange]) => {
    if (isOrange) {
      bCtx.save();
      bCtx.globalCompositeOperation = 'destination-out';
      bCtx.fillStyle = '#fff';
      bCtx.beginPath();
      bCtx.arc(fx, fy, 4.6, 0, Math.PI * 2);
      bCtx.fill();
      bCtx.restore();
      oCtx.fillStyle = 'rgba(255,255,255,0.92)';
      oCtx.beginPath();
      oCtx.arc(fx, fy, 4.0, 0, Math.PI * 2);
      oCtx.fill();
    } else {
      [oCtx, bCtx, yCtx].forEach((ctx) => {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(fx, fy, 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
  });

  [oCtx, bCtx, yCtx].forEach((ctx) => ctx.restore());

  // 7. Quiet Risograph title typography centred in the clean lower paper margin
  bCtx.fillStyle = 'rgba(255,255,255,0.96)';
  bCtx.font = '500 24px "IBM Plex Mono", monospace';
  bCtx.textAlign = 'center';
  bCtx.textBaseline = 'alphabetic';
  bCtx.letterSpacing = '0.07em';
  bCtx.fillText('the quick brown fox jumps over the lazy dog', LW / 2, 742);
}

/* ---------- Swaying Grass Blades & Drifting Leaves ---------- */
function drawMeadowLife(oCtx, bCtx, yCtx, u) {
  const sway = Math.sin(u * Math.PI * 2) * 5.5;
  const tufts = [
    [118, 578, 22], [204, 594, 18], [322, 586, 20], [412, 598, 17],
    [796, 596, 19], [878, 582, 22], [964, 594, 18], [1084, 580, 21],
  ];
  bCtx.strokeStyle = 'rgba(255,255,255,0.72)';
  bCtx.lineWidth = 2.6;
  bCtx.lineCap = 'round';
  tufts.forEach(([gx, gy, h], i) => {
    const ph = Math.sin(u * Math.PI * 2 + i * 0.9) * 3.5 + sway * 0.4;
    for (let b = -1; b <= 1; b++) {
      bCtx.beginPath();
      bCtx.moveTo(gx + b * 5, gy);
      bCtx.quadraticCurveTo(gx + b * 8 + ph * 0.5, gy - h * 0.55, gx + b * 12 + ph, gy - h * (b === 0 ? 1 : 0.78));
      bCtx.stroke();
    }
  });

  // Three gentle drifting orange leaves floating across the autumn breeze
  const leaves = [
    { x0: 140, y0: 230, dx: 210, dy: 90, off: 0.05 },
    { x0: 760, y0: 190, dx: 230, dy: 110, off: 0.42 },
    { x0: 420, y0: 145, dx: 240, dy: 80, off: 0.78 },
  ];
  leaves.forEach((lf, idx) => {
    const t = (u + lf.off) % 1;
    const lx = lf.x0 + lf.dx * t;
    const ly = lf.y0 + lf.dy * t + Math.sin(t * Math.PI * 4 + idx) * 14;
    const ang = Math.sin(t * Math.PI * 6 + idx) * 0.6 + 0.3;
    const fade = smoothstep(0.0, 0.12, t) * (1 - smoothstep(0.86, 1.0, t));
    if (fade <= 0.02) return;

    oCtx.save();
    oCtx.translate(lx, ly);
    oCtx.rotate(ang);
    oCtx.fillStyle = `rgba(255,255,255,${(0.88 * fade).toFixed(3)})`;
    oCtx.beginPath();
    oCtx.ellipse(0, 0, 7.5, 3.6, 0, 0, Math.PI * 2);
    oCtx.fill();
    oCtx.restore();
  });
}

/* ---------- Stylized Risograph Sleeping Dog (Warm Golden-Tan + Chestnut Overprint) ---------- */
function drawSleepingDog(oCtx, bCtx, yCtx, u, alert) {
  const breath = Math.sin(u * Math.PI * 2) * 2.8;
  const earLift = alert * -9;
  const tailWag = alert * -9 + Math.sin(u * Math.PI * 2) * 2.2;
  const bx = DOG_X, by = GY + 6;

  // 1. Soft grounded contact shadow on the grass
  bCtx.fillStyle = 'rgba(255,255,255,0.38)';
  bCtx.beginPath();
  bCtx.ellipse(bx - 6, by + 5, 118, 9, 0, 0, Math.PI * 2);
  bCtx.fill();

  // Build main silhouette so we cleanly knock out green meadow behind the dog
  const dogMask = new Path2D();
  dogMask.moveTo(bx - 66, by);
  dogMask.bezierCurveTo(bx - 70, by - 56 - breath, bx - 18, by - 82 - breath, bx + 40, by - 74 - breath * 0.8);
  dogMask.bezierCurveTo(bx + 92, by - 66 - breath * 0.5, bx + 112, by - 32, bx + 104, by);
  dogMask.closePath();

  const tail = new Path2D();
  tail.moveTo(bx + 96, by - 18);
  tail.quadraticCurveTo(bx + 132, by - 26 + tailWag, bx + 138, by - 8 + tailWag * 0.5);
  tail.quadraticCurveTo(bx + 124, by + 2, bx + 94, by - 4);
  tail.closePath();
  dogMask.addPath(tail);

  const paw = new Path2D();
  paw.moveTo(bx - 54, by);
  paw.lineTo(bx - 128, by);
  paw.quadraticCurveTo(bx - 136, by - 12, bx - 122, by - 16);
  paw.lineTo(bx - 54, by - 18);
  paw.closePath();
  dogMask.addPath(paw);

  const head = new Path2D();
  head.moveTo(bx - 44, by - 14);
  head.lineTo(bx - 110, by - 14);
  head.quadraticCurveTo(bx - 120, by - 17, bx - 118, by - 30);
  head.lineTo(bx - 90, by - 54);
  head.quadraticCurveTo(bx - 62, by - 66, bx - 42, by - 46);
  head.closePath();
  dogMask.addPath(head);

  // Knock out green meadow behind the dog
  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(dogMask);
    ctx.restore();
  });

  // 2. Warm golden-tan coat (Yellow + light Orange overprint -> cosy sandy golden dog!)
  yCtx.fillStyle = 'rgba(255,255,255,0.68)';
  yCtx.fill(dogMask);
  oCtx.fillStyle = 'rgba(255,255,255,0.22)';
  oCtx.fill(dogMask);

  // Slightly paler cream front paw & muzzle underside
  [yCtx, oCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fill(paw);
    ctx.restore();
  });

  // 3. Rich chestnut-brown saddle patch on the dog's back (3-drum warm brown overprint)
  const saddle = new Path2D();
  saddle.moveTo(bx + 8, by - 75 - breath * 0.9);
  saddle.bezierCurveTo(bx + 44, by - 78 - breath * 0.7, bx + 84, by - 64 - breath * 0.5, bx + 96, by - 38);
  saddle.bezierCurveTo(bx + 66, by - 31, bx + 32, by - 38, bx + 8, by - 75 - breath * 0.9);
  saddle.closePath();

  yCtx.fillStyle = 'rgba(255,255,255,0.82)';
  yCtx.fill(saddle);
  oCtx.fillStyle = 'rgba(255,255,255,0.66)';
  oCtx.fill(saddle);
  bCtx.fillStyle = 'rgba(255,255,255,0.52)';
  bCtx.fill(saddle);

  // Tucked hind-leg paper-cream contour sliver
  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + 68, by - 4);
    ctx.quadraticCurveTo(bx + 46, by - 22, bx + 66, by - 40);
    ctx.stroke();
    ctx.restore();
  });

  // 4. Crisp Indigo blue collar band peeking behind the floppy ear
  const collar = new Path2D();
  collar.moveTo(bx - 50, by - 53 - breath * 0.4);
  collar.quadraticCurveTo(bx - 42, by - 32, bx - 47, by - 14);
  collar.lineTo(bx - 38, by - 14);
  collar.quadraticCurveTo(bx - 33, by - 32, bx - 41, by - 52 - breath * 0.4);
  collar.closePath();

  [oCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(collar);
    ctx.restore();
  });
  bCtx.fillStyle = 'rgba(255,255,255,0.92)';
  bCtx.fill(collar);

  // 5. Graphic teardrop floppy ear in rich warm chestnut-brown (Y + O + B overprint)
  const ear = new Path2D();
  ear.moveTo(bx - 70, by - 53);
  ear.bezierCurveTo(bx - 48, by - 50, bx - 43, by - 12 + earLift, bx - 60, by - 2 + earLift);
  ear.bezierCurveTo(bx - 78, by + 3 + earLift, bx - 88, by - 22 + earLift * 0.5, bx - 78, by - 50);
  ear.closePath();

  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(ear);
    ctx.restore();
  });

  yCtx.fillStyle = 'rgba(255,255,255,0.82)';
  yCtx.fill(ear);
  oCtx.fillStyle = 'rgba(255,255,255,0.72)';
  oCtx.fill(ear);
  bCtx.fillStyle = 'rgba(255,255,255,0.62)';
  bCtx.fill(ear);

  // Dark warm-brown button nose
  oCtx.fillStyle = 'rgba(255,255,255,0.86)';
  oCtx.beginPath();
  oCtx.arc(bx - 115, by - 27, 5.6, 0, Math.PI * 2);
  oCtx.fill();
  bCtx.fillStyle = 'rgba(255,255,255,0.92)';
  bCtx.beginPath();
  bCtx.arc(bx - 115, by - 27, 5.4, 0, Math.PI * 2);
  bCtx.fill();

  // Sleeping curved eye, opening into an upward peek as the fox flies overhead
  const drawEye = (ctx, a) => {
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = 3.0;
    ctx.lineCap = 'round';
    if (alert > 0.35) {
      ctx.beginPath();
      ctx.arc(bx - 89, by - 36, 3.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(bx - 97, by - 35);
      ctx.quadraticCurveTo(bx - 89, by - 30, bx - 81, by - 35);
      ctx.stroke();
    }
  };
  drawEye(oCtx, 0.78);
  drawEye(bCtx, 0.94);
}

/* ---------- Parametric Motion Curve & Stylized Risograph Fox ---------- */
/* Single clean closed silhouette per leg — no overlapping circles or cutouts,
   tapering naturally from shoulder/thigh into slender fox legs and neat paws. */
function buildFoxLeg(x0, y0, ang1, len1, ang2, len2, w0, w1, w2, pawForward) {
  const x1 = x0 + Math.sin(ang1) * len1;
  const y1 = y0 + Math.cos(ang1) * len1;
  const x2 = x1 + Math.sin(ang2) * len2;
  const y2 = y1 + Math.cos(ang2) * len2;

  // Segment unit normals (pointing to the right/front of the downward limb direction)
  const n1x = Math.cos(ang1), n1y = -Math.sin(ang1);
  const n2x = Math.cos(ang2), n2y = -Math.sin(ang2);
  let mx = n1x + n2x, my = n1y + n2y;
  const ml = Math.hypot(mx, my) || 1;
  mx /= ml; my /= ml;

  // Small tapered paw extending slightly forward from the ankle
  const pawAng = ang2 + pawForward;
  const px = x2 + Math.sin(pawAng) * (w2 * 2.5);
  const py = y2 + Math.cos(pawAng) * (w2 * 2.1);

  const f0x = x0 + n1x * w0, f0y = y0 + n1y * w0;
  const f1x = x1 + mx * w1,  f1y = y1 + my * w1;
  const f2x = x2 + n2x * w2, f2y = y2 + n2y * w2;

  const b0x = x0 - n1x * w0, b0y = y0 - n1y * w0;
  const b1x = x1 - mx * w1,  b1y = y1 - my * w1;
  const b2x = x2 - n2x * w2, b2y = y2 - n2y * w2;

  const path = new Path2D();
  path.moveTo(f0x, f0y);
  path.quadraticCurveTo(f1x, f1y, f2x, f2y);
  path.quadraticCurveTo(px + n2x * w2 * 0.7, py + n2y * w2 * 0.7, px, py);
  path.quadraticCurveTo(px - n2x * w2 * 0.6, py - n2y * w2 * 0.6, b2x, b2y);
  path.quadraticCurveTo(b1x, b1y, b0x, b0y);
  path.closePath();

  return { path, x1, y1, x2, y2, px, py, footY: Math.max(y2, py) + w2 * 0.6 };
}

function sampleFoxPose(u) {
  const x = lerp(IMG.x - 135, IMG.x + IMG.w + 150, u);
  const tStart = 0.39, tEnd = 0.63;
  let yOff = 0, tilt = 0, arch = 0, tailAng = 0.16;
  // Each leg has explicit upper and lower angles for anatomical canine articulation:
  // Forelegs bend at the elbow (lower leg angles slightly forward/down);
  // Hindlegs bend at the hock (thigh angles forward/back, lower leg trails cleanly).
  let fn1, fn2, ff1, ff2, hn1, hn2, hf1, hf2;

  const runPhase = u * Math.PI * 12;
  const runBob = Math.max(0, Math.sin(runPhase)) * -10;

  if (u >= tStart && u <= tEnd) {
    const s = (u - tStart) / (tEnd - tStart);
    const arc = Math.sin(s * Math.PI);
    yOff = -182 * Math.pow(arc, 0.88);
    tilt = Math.cos(s * Math.PI) * 0.40;
    arch = -11 * arc + 4 * (1 - arc);
    tailAng = lerp(0.28, 0.06, arc) + (s > 0.5 ? (s - 0.5) * 0.48 : 0);

    const landPrep = smoothstep(0.56, 1.0, s);
    // Mid-air forelegs: graceful reaching arc forward, then extending down to meet the grass
    fn1 = lerp(0.86, 0.46, landPrep);
    fn2 = lerp(1.08, 0.56, landPrep);
    ff1 = lerp(0.62, 0.66, landPrep);
    ff2 = lerp(0.84, 0.78, landPrep);

    // Mid-air hindlegs: streaming sleekly back behind the leap, then tucking forward to land
    hn1 = lerp(-0.78, 0.36, smoothstep(0.52, 1.0, s));
    hn2 = lerp(-1.08, -0.08, smoothstep(0.52, 1.0, s));
    hf1 = lerp(-0.56, 0.18, smoothstep(0.52, 1.0, s));
    hf2 = lerp(-0.88, -0.24, smoothstep(0.52, 1.0, s));
  } else {
    const crouch = Math.exp(-Math.pow((u - 0.355) / 0.035, 2));
    const land = Math.exp(-Math.pow((u - 0.655) / 0.036, 2));

    const g1 = Math.sin(runPhase);
    const g2 = Math.sin(runPhase - 0.9);
    yOff = runBob * (1 - Math.max(crouch, land)) + crouch * 8 + land * 7;
    tilt = g1 * 0.06 - crouch * 0.20 - land * 0.16;
    arch = -g1 * 5 + crouch * 13 + land * 11;
    tailAng = 0.15 + g1 * 0.08 + crouch * 0.16 + land * 0.22;

    // Grounded gallop: forelegs swing naturally with gentle elbow curve
    fn1 = g1 * 0.62 + 0.12;
    fn2 = fn1 + (g1 > 0 ? 0.22 : -0.28);
    ff1 = g2 * 0.60 + 0.08;
    ff2 = ff1 + (g2 > 0 ? 0.20 : -0.26);

    // Grounded gallop: hindlegs drive back and tuck forward cleanly at the hock
    hn1 = -g1 * 0.66 + 0.06;
    hn2 = hn1 - 0.34 - Math.max(0, g1) * 0.18;
    hf1 = -g2 * 0.64 + 0.04;
    hf2 = hf1 - 0.32 - Math.max(0, g2) * 0.18;

    if (crouch > 0.04) {
      fn1 = lerp(fn1, -0.18, crouch); fn2 = lerp(fn2, 0.10, crouch);
      ff1 = lerp(ff1,  0.04, crouch); ff2 = lerp(ff2, 0.26, crouch);
      hn1 = lerp(hn1,  0.72, crouch); hn2 = lerp(hn2, -0.18, crouch);
      hf1 = lerp(hf1,  0.54, crouch); hf2 = lerp(hf2, -0.32, crouch);
    }
    if (land > 0.04) {
      fn1 = lerp(fn1, 0.24, land); fn2 = lerp(fn2, 0.36, land);
      ff1 = lerp(ff1, 0.42, land); ff2 = lerp(ff2, 0.50, land);
      hn1 = lerp(hn1, 0.48, land); hn2 = lerp(hn2, -0.22, land);
      hf1 = lerp(hf1, 0.28, land); hf2 = lerp(hf2, -0.36, land);
    }
  }

  return { x, yOff, tilt, arch, tailAng, fn1, fn2, ff1, ff2, hn1, hn2, hf1, hf2 };
}

function drawStylizedFox(oCtx, bCtx, yCtx, u) {
  const { x: fx, yOff, tilt, arch, tailAng, fn1, fn2, ff1, ff2, hn1, hn2, hf1, hf2 } = sampleFoxPose(u);
  const scale = 1.18;
  const c = Math.cos(-tilt), s = Math.sin(-tilt);
  const R0 = (x, y) => [(x * c - y * s) * scale, (x * s + y * c) * scale];

  // Probe lowest paw coordinate so grounded strides plant firmly on the meadow
  const pFF = buildFoxLeg(...R0(35, 6),  ff1 - tilt, 25 * scale, ff2 - tilt, 26 * scale, 6.2 * scale, 3.3 * scale, 2.1 * scale, 0.45);
  const pHF = buildFoxLeg(...R0(-40, 4), hf1 - tilt, 26 * scale, hf2 - tilt, 27 * scale, 8.8 * scale, 3.6 * scale, 2.1 * scale, 0.35);
  const pFN = buildFoxLeg(...R0(40, 7),  fn1 - tilt, 25 * scale, fn2 - tilt, 26 * scale, 6.8 * scale, 3.5 * scale, 2.2 * scale, 0.45);
  const pHN = buildFoxLeg(...R0(-44, 5), hn1 - tilt, 26 * scale, hn2 - tilt, 27 * scale, 9.6 * scale, 3.8 * scale, 2.2 * scale, 0.35);
  const maxFootY = Math.max(pFF.footY, pHF.footY, pFN.footY, pHN.footY);

  const air = Math.max(0, -yOff);
  const fy = air > 12 ? (GY - 64 + yOff) : (GY + 4 - maxFootY + Math.max(0, yOff) * 0.45);

  // Ground shadow softening and shrinking as the fox climbs higher
  if (fx > IMG.x - 60 && fx < IMG.x + IMG.w + 60) {
    const shScale = clamp(1 - air / 240, 0.26, 1);
    bCtx.fillStyle = `rgba(255,255,255,${(0.32 * shScale).toFixed(3)})`;
    bCtx.beginPath();
    bCtx.ellipse(fx, GY + 8, 66 * shScale, 6.0 * shScale, 0, 0, Math.PI * 2);
    bCtx.fill();
  }

  const T = (x, y) => [fx + (x * c - y * s) * scale, fy + (x * s + y * c) * scale];

  // --- 1. Far limbs & far ear (Orange + Indigo overprint = warm deep plum shadow) ---
  const farFront = buildFoxLeg(...T(35, 6),  ff1 - tilt, 25 * scale, ff2 - tilt, 26 * scale, 6.2 * scale, 3.3 * scale, 2.1 * scale, 0.45);
  const farHind  = buildFoxLeg(...T(-40, 4), hf1 - tilt, 26 * scale, hf2 - tilt, 27 * scale, 8.8 * scale, 3.6 * scale, 2.1 * scale, 0.35);
  const farParts = new Path2D();
  farParts.addPath(farFront.path);
  farParts.addPath(farHind.path);
  farParts.moveTo(...T(42, -22));
  farParts.lineTo(...T(50, -53));
  farParts.lineTo(...T(60, -24));
  farParts.closePath();

  [yCtx, bCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(farParts);
    ctx.restore();
  });
  oCtx.fillStyle = 'rgba(255,255,255,0.92)';
  oCtx.fill(farParts);
  bCtx.fillStyle = 'rgba(255,255,255,0.74)';
  bCtx.fill(farParts);

  // --- 2. Full Graphic Brush Tail (smoothly rooted into the rump + bold paper-white tip) ---
  const tc = Math.cos(tailAng - tilt), ts = Math.sin(tailAng - tilt);
  const [tx0, ty0] = T(-45, 0);
  const TP = (lx, ly) => [tx0 + (-lx * tc + ly * ts) * scale, ty0 + (-lx * ts - ly * tc) * scale];

  const tailBody = new Path2D();
  tailBody.moveTo(...TP(-8, -9));
  tailBody.bezierCurveTo(...TP(22, -17), ...TP(76, -21), ...TP(116, 2));
  tailBody.bezierCurveTo(...TP(80, 26), ...TP(24, 24), ...TP(-6, 11));
  tailBody.closePath();

  const tailWhiteTip = new Path2D();
  tailWhiteTip.moveTo(...TP(76, 17));
  tailWhiteTip.lineTo(...TP(69, 6));
  tailWhiteTip.lineTo(...TP(79, 0));
  tailWhiteTip.lineTo(...TP(70, -8));
  tailWhiteTip.lineTo(...TP(78, -15));
  tailWhiteTip.bezierCurveTo(...TP(95, -12), ...TP(108, -5), ...TP(116, 2));
  tailWhiteTip.bezierCurveTo(...TP(107, 11), ...TP(93, 17), ...TP(76, 17));
  tailWhiteTip.closePath();

  // --- 3. Sleek Cutout Torso, Wedge Head & Slender Near Limbs ---
  const nearFront = buildFoxLeg(...T(40, 7),  fn1 - tilt, 25 * scale, fn2 - tilt, 26 * scale, 6.8 * scale, 3.5 * scale, 2.2 * scale, 0.45);
  const nearHind  = buildFoxLeg(...T(-44, 5), hn1 - tilt, 26 * scale, hn2 - tilt, 27 * scale, 9.6 * scale, 3.8 * scale, 2.2 * scale, 0.35);

  const torso = new Path2D();
  torso.moveTo(...T(-54, -4));
  torso.bezierCurveTo(...T(-44, -24 - arch), ...T(4, -26 - arch), ...T(38, -20));
  torso.lineTo(...T(50, -28));
  torso.lineTo(...T(68, -26));
  torso.lineTo(...T(99, -12));
  torso.quadraticCurveTo(...T(83, -4), ...T(64, -6));
  torso.bezierCurveTo(...T(64, 12), ...T(48, 22), ...T(28, 16));
  torso.bezierCurveTo(...T(4, 10), ...T(-22, 8), ...T(-42, 14));
  torso.quadraticCurveTo(...T(-56, 10), ...T(-54, -4));
  torso.closePath();

  // Near sharp triangle ear
  const nearEar = new Path2D();
  nearEar.moveTo(...T(50, -24));
  nearEar.lineTo(...T(60, -56));
  nearEar.lineTo(...T(71, -23));
  nearEar.closePath();

  // Paint each part individually (no winding-cancellation gaps where tail/limbs join torso)
  const nearParts = [tailBody, nearFront.path, nearHind.path, torso, nearEar];

  // Knock out all background drums under the fox so Fluorescent Orange prints bright and pure
  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    nearParts.forEach((p) => ctx.fill(p));
    ctx.restore();
  });

  // Vivid Fluorescent Orange coat
  oCtx.fillStyle = 'rgba(255,255,255,0.96)';
  nearParts.forEach((p) => oCtx.fill(p));

  // --- 4. Crisp Paper-White Knockouts (tail tip, cheek, chest bib, inner ear) ---
  const knockouts = new Path2D();
  knockouts.addPath(tailWhiteTip);
  knockouts.moveTo(...T(62, -13));
  knockouts.lineTo(...T(88, -11));
  knockouts.quadraticCurveTo(...T(76, -5), ...T(62, -6));
  knockouts.closePath();
  knockouts.moveTo(...T(54, -8));
  knockouts.lineTo(...T(65, -4));
  knockouts.quadraticCurveTo(...T(62, 13), ...T(48, 17));
  knockouts.quadraticCurveTo(...T(49, 3), ...T(54, -8));
  knockouts.closePath();
  knockouts.moveTo(...T(55, -26));
  knockouts.lineTo(...T(60, -45));
  knockouts.lineTo(...T(66, -25));
  knockouts.closePath();

  [oCtx, bCtx, yCtx].forEach((ctx) => {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#fff';
    ctx.fill(knockouts);
    ctx.restore();
  });

  // --- 5. Clean Clipped Indigo Boot Socks (exact fit inside each slender lower leg!) ---
  const paintSock = (leg) => {
    bCtx.save();
    bCtx.clip(leg.path);
    const sx = lerp(leg.x1, leg.x2, 0.25);
    const sy = lerp(leg.y1, leg.y2, 0.25);
    const r = Math.hypot(leg.px - sx, leg.py - sy) + 12 * scale;
    bCtx.fillStyle = 'rgba(255,255,255,0.95)';
    bCtx.beginPath();
    bCtx.arc(leg.px, leg.py, r * 0.92, 0, Math.PI * 2);
    bCtx.fill();
    bCtx.restore();
  };
  paintSock(nearFront);
  paintSock(nearHind);

  // Dark Indigo ear tip
  bCtx.fillStyle = 'rgba(255,255,255,0.96)';
  bCtx.beginPath();
  bCtx.moveTo(...T(56.4, -43));
  bCtx.lineTo(...T(60, -56));
  bCtx.lineTo(...T(64.3, -42));
  bCtx.closePath();
  bCtx.fill();

  // Snout nose bead
  bCtx.beginPath();
  bCtx.arc(...T(98, -12), 3.3 * scale, 0, Math.PI * 2);
  bCtx.fill();

  // Stylized almond eye
  bCtx.beginPath();
  bCtx.ellipse(...T(72, -17), 3.5 * scale, 2.1 * scale, -tilt - 0.12, 0, Math.PI * 2);
  bCtx.fill();
}

/* ---------- Compose Frame into Single Packed RGB Texture ---------- */
function composeFrame(frameIdx) {
  const u = (frameIdx % FRAMES) / FRAMES;
  const alert = smoothstep(0.42, 0.48, u) * (1 - smoothstep(0.55, 0.62, u));

  // Copy static backdrop drums
  const pairs = [[staticO, drumO], [staticB, drumB], [staticY, drumY]];
  pairs.forEach(([src, dst]) => {
    dst.x.setTransform(1, 0, 0, 1, 0, 0);
    dst.x.globalCompositeOperation = 'copy';
    dst.x.drawImage(src.c, 0, 0);
    dst.x.globalCompositeOperation = 'source-over';
    dst.x.setTransform(K, 0, 0, K, 0, 0);
  });

  // Draw animated meadow details, sleeping dog & leaping fox clipped to the print frame
  [drumO.x, drumB.x, drumY.x].forEach((ctx) => {
    ctx.save();
    clipImageArea(ctx);
  });

  drawMeadowLife(drumO.x, drumB.x, drumY.x, u);
  drawSleepingDog(drumO.x, drumB.x, drumY.x, u, alert);
  drawStylizedFox(drumO.x, drumB.x, drumY.x, u);

  [drumO.x, drumB.x, drumY.x].forEach((ctx) => ctx.restore());

  // Pack Orange -> R, Indigo -> G, Yellow -> B
  const pCtx = packed.x;
  pCtx.setTransform(1, 0, 0, 1, 0, 0);
  pCtx.globalCompositeOperation = 'source-over';
  pCtx.fillStyle = '#000';
  pCtx.fillRect(0, 0, W, H);

  const packChan = (src, hex) => {
    const tx = tint.x;
    tx.setTransform(1, 0, 0, 1, 0, 0);
    tx.globalCompositeOperation = 'copy';
    tx.drawImage(src.c, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = hex;
    tx.fillRect(0, 0, W, H);
    pCtx.globalCompositeOperation = 'lighter';
    pCtx.drawImage(tint.c, 0, 0);
  };

  packChan(drumO, '#ff0000');
  packChan(drumB, '#00ff00');
  packChan(drumY, '#0000ff');
  pCtx.globalCompositeOperation = 'source-over';
}

/* ---------- WebGL Three-Drum Risograph Shader ---------- */
const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS = `precision highp float;
uniform sampler2D uPlates;
uniform vec2 uRes;
uniform vec2 uOffO;
uniform vec2 uOffB;
uniform vec2 uOffY;

float hash(vec2 p){
  vec3 q = fract(vec3(p.xyx) * .1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x),
             mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0., a = .5;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 17.3; a *= .5; }
  return s;
}

/* Authentic Risograph halftone screen + grainy soy ink on solids */
float risoInk(float cov, vec2 p, float ang, float dotPitch, float seed){
  if (cov <= 0.008) return 0.0;
  float c = cos(ang), s = sin(ang);
  vec2 rp = mat2(c, -s, s, c) * p / dotPitch;
  vec2 cell = fract(rp) - 0.5;
  float dist = length(cell) * 1.4142;

  float gr = noise(p * 1.05 + seed) * 0.62 + hash(floor(p * 1.4 + seed)) * 0.38;

  if (cov > 0.80) {
    float solid = smoothstep(0.76, 0.89, cov);
    float pinhole = step(0.992, hash(floor(p * 1.05 + seed)));
    float roller = 0.94 + 0.06 * noise(vec2(p.x * 0.025, p.y * 0.14) + seed * 0.3);
    return clamp(solid * roller * (0.89 + 0.11 * gr) * (1.0 - 0.30 * pinhole), 0.0, 1.0);
  }

  float rad = sqrt(clamp(cov * 1.14, 0.0, 1.0));
  float dotMask = 1.0 - smoothstep(rad - 0.20, rad + 0.15, dist + (gr - 0.5) * 0.22);
  return clamp(dotMask * (0.90 + 0.10 * gr), 0.0, 1.0);
}

void main(){
  vec2 uv = vec2(gl_FragCoord.x / uRes.x, 1.0 - gl_FragCoord.y / uRes.y);
  vec2 p = uv * vec2(1200.0, 800.0);

  // Warm uncoated cream paper stock (stable grain — no full-sheet flicker)
  vec3 paper = vec3(0.960, 0.940, 0.896);
  float cloud = fbm(p * 0.022);
  float fine = noise(p * 1.15);
  float fibers = noise(vec2(p.x * 0.55, p.y * 2.4));
  vec3 col = paper * (0.976 + 0.032 * cloud)
           - vec3(0.011) * (1.0 - fine)
           - vec3(0.008) * (1.0 - fibers);
  col *= 1.0 - 0.16 * step(0.9991, hash(floor(p * 0.85)));

  // Sample each ink drum with its own subtle Risograph registration offset
  vec2 uvO = clamp(uv + uOffO, 0.0, 1.0);
  vec2 uvB = clamp(uv + uOffB, 0.0, 1.0);
  vec2 uvY = clamp(uv + uOffY, 0.0, 1.0);

  float covO = texture2D(uPlates, uvO).r;
  float covB = texture2D(uPlates, uvB).g;
  float covY = texture2D(uPlates, uvY).b;

  // Classic separated screen angles (Yellow ~5 deg, Orange ~25 deg, Indigo ~70 deg)
  float inkY = risoInk(covY, p + uOffY * vec2(1200.0, 800.0), 0.09, 3.9, 11.3);
  float inkO = risoInk(covO, p + uOffO * vec2(1200.0, 800.0), 0.44, 3.9, 37.9);
  float inkB = risoInk(covB, p + uOffB * vec2(1200.0, 800.0), 1.22, 3.9, 73.1);

  // Subtractive semi-transparent Risograph soy-ink overprinting
  vec3 tY = mix(vec3(1.0), vec3(0.99, 0.81, 0.18), inkY * 0.90);
  vec3 tO = mix(vec3(1.0), vec3(0.99, 0.30, 0.17), inkO * 0.92);
  vec3 tB = mix(vec3(1.0), vec3(0.13, 0.29, 0.56), inkB * 0.95);

  col = col * tY * tO * tB;

  // Very gentle edge warmth on the paper margins
  float edge = length((uv - 0.5) * vec2(1.0, 0.88));
  col *= 1.0 - 0.038 * smoothstep(0.44, 0.80, edge);

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

let gl = null, prog = null, plateTex = null, U = {};

function initGL() {
  gl = view.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return false;

  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  plateTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, plateTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(prog, 'uPlates'), 0);

  U.res = gl.getUniformLocation(prog, 'uRes');
  U.offO = gl.getUniformLocation(prog, 'uOffO');
  U.offB = gl.getUniformLocation(prog, 'uOffB');
  U.offY = gl.getUniformLocation(prog, 'uOffY');
  return true;
}

let lastFrame = -1;

function renderFrame(frameIdx, force = false) {
  if (!gl) return;
  const f = ((frameIdx % FRAMES) + FRAMES) % FRAMES;
  if (!force && f === lastFrame) return;
  lastFrame = f;

  composeFrame(f);

  gl.bindTexture(gl.TEXTURE_2D, plateTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, packed.c);

  // Steady, crisp Risograph misregistration across the three ink drums
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U.res, W, H);
  gl.uniform2f(U.offO, -1.6 / LW,  1.1 / LH);
  gl.uniform2f(U.offB,  0.3 / LW, -0.4 / LH);
  gl.uniform2f(U.offY,  1.3 / LW,  0.8 / LH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function loop(now) {
  const t = frozen !== null ? frozen : now / 1000;
  const frameIdx = Math.floor(((t % CYCLE) + CYCLE) % CYCLE * FPS);
  renderFrame(frameIdx);
  if (frozen === null) requestAnimationFrame(loop);
}

document.fonts.load('500 24px "IBM Plex Mono"').catch(() => {}).then(() => {
  resizeBuffers();
  drawStaticBackdrop();
  initGL();
  const startFrame = frozen !== null
    ? Math.floor(((frozen % CYCLE) + CYCLE) % CYCLE * FPS)
    : 0;
  renderFrame(startFrame, true);
  if (frozen === null) requestAnimationFrame(loop);

  addEventListener('resize', () => {
    if (resizeBuffers()) {
      drawStaticBackdrop();
      renderFrame(lastFrame < 0 ? 0 : lastFrame, true);
    }
  });
});
})();
</script>
